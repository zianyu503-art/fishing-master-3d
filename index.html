<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="./manifest.json" />
  <title>釣魚大師 3D · 翡翠湖</title>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
  <style>
    :root {
      --glass-bg: rgba(10, 22, 38, 0.56);
      --glass-strong: rgba(10, 22, 38, 0.74);
      --glass-border: rgba(255, 255, 255, 0.14);
      --glass-highlight: inset 0 1px 0 rgba(255, 255, 255, 0.16);
      --glass-shadow: 0 10px 28px rgba(0, 0, 0, 0.28);
      --emerald: #34d399;
      --sky: #38bdf8;
      --gold: #fbbf24;
      --danger: #ef4444;
      --spring: cubic-bezier(0.22, 1, 0.36, 1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #06111f;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      color: #f8fafc;
      touch-action: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior: none;
    }

    .tabular { font-variant-numeric: tabular-nums; }

    #game-viewport {
      position: fixed;
      inset: 0;
      touch-action: none;
    }

    /* Loading Screen */
    #loading-screen {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: radial-gradient(circle at center, #0f2942 0%, #050d18 75%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 20px;
      text-align: center;
      transition: opacity 0.4s ease;
    }
    .load-logo { font-size: 30px; font-weight: 800; letter-spacing: 1px; }
    .load-sub { font-size: 13.5px; color: #94a3b8; }
    .load-track {
      width: min(320px, 80vw);
      height: 7px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.1);
      overflow: hidden;
    }
    #loading-bar-fill {
      width: 5%;
      height: 100%;
      background: linear-gradient(90deg, #10b981, #38bdf8);
      transition: width 0.2s ease;
    }

    /* Frosted Glass Primitives */
    .glass-surface {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(18px) saturate(165%);
      -webkit-backdrop-filter: blur(18px) saturate(165%);
      box-shadow: var(--glass-highlight), var(--glass-shadow);
    }

    /* Main HUD Shell */
    #hud {
      position: fixed;
      inset: 0;
      z-index: 20;
      pointer-events: none;
      padding: max(14px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 10px;
    }

    /* Minimal Top Bar */
    .hud-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      width: 100%;
    }

    .spot-pill {
      pointer-events: auto;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      border-radius: 999px;
      color: #f8fafc;
      font-size: 13.5px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: transform 0.18s var(--spring), border-color 0.2s, background 0.2s;
    }
    .spot-pill:hover {
      border-color: rgba(52, 211, 153, 0.55);
      background: rgba(15, 32, 54, 0.68);
    }
    .spot-pill:active { transform: scale(0.94); }
    .spot-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--emerald);
      box-shadow: 0 0 8px var(--emerald);
      flex-shrink: 0;
    }
    .spot-swap-icon {
      width: 14px;
      height: 14px;
      opacity: 0.68;
      transition: transform 0.35s var(--spring);
      flex-shrink: 0;
    }
    .spot-pill:hover .spot-swap-icon { transform: rotate(120deg); opacity: 0.95; }

    /* Unified Top-Right Frosted Capsule */
    .status-capsule {
      pointer-events: auto;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 6px 5px 12px;
      border-radius: 999px;
    }
    .profile-chip {
      display: flex;
      align-items: center;
      gap: 8px;
      padding-right: 6px;
      border-right: 1px solid rgba(255, 255, 255, 0.12);
    }
    .coin-val {
      font-size: 14px;
      font-weight: 800;
      color: var(--gold);
      white-space: nowrap;
    }
    .lv-block {
      display: flex;
      flex-direction: column;
      gap: 3px;
      min-width: 38px;
    }
    .lv-val {
      font-size: 11px;
      font-weight: 800;
      color: var(--sky);
      line-height: 1;
      letter-spacing: 0.3px;
    }
    .xp-bar {
      width: 44px;
      height: 3.5px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 99px;
      overflow: hidden;
    }
    #ui-xp-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #38bdf8, #34d399);
      transition: width 0.35s var(--spring);
    }

    .capsule-btn {
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(255, 255, 255, 0.07);
      color: #e2e8f0;
      padding: 6px 11px;
      border-radius: 999px;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: transform 0.16s var(--spring), background 0.18s, border-color 0.18s, color 0.18s;
    }
    .capsule-btn:hover {
      background: rgba(56, 189, 248, 0.16);
      border-color: rgba(56, 189, 248, 0.42);
      color: #ffffff;
    }
    .capsule-btn:active { transform: scale(0.92); }

    .icon-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(255, 255, 255, 0.07);
      color: #e2e8f0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: transform 0.16s var(--spring), background 0.18s, border-color 0.18s, color 0.18s;
    }
    .icon-btn:hover {
      background: rgba(56, 189, 248, 0.16);
      border-color: rgba(56, 189, 248, 0.42);
      color: var(--sky);
    }
    .icon-btn:active { transform: scale(0.9); }
    .icon-btn.is-muted {
      color: #94a3b8;
      background: rgba(15, 23, 42, 0.45);
    }
    .icon-btn svg { width: 16px; height: 16px; }

    /* Center Prompt & Tactile Strike QTE */
    .hud-center {
      align-self: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 7px;
      text-align: center;
      max-width: 90vw;
      pointer-events: none;
    }
    #strike-qte {
      display: none;
      pointer-events: auto;
      cursor: pointer;
      touch-action: none;
      width: 108px;
      height: 108px;
      border-radius: 50%;
      border: 3px solid rgba(254, 240, 138, 0.92);
      background: radial-gradient(circle, rgba(239, 68, 68, 0.88), rgba(153, 27, 27, 0.65));
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: 900;
      letter-spacing: 0.5px;
      box-shadow: 0 0 34px rgba(239, 68, 68, 0.8);
      animation: pulseRing 0.4s infinite alternate;
    }
    @keyframes pulseRing {
      from { transform: scale(0.94); }
      to { transform: scale(1.08); }
    }
    #strike-qte.shock-qte {
      width: 126px;
      height: 126px;
      font-size: 18px;
      border-color: #67e8f9;
      color: #ffffff;
      background: radial-gradient(circle, rgba(6, 182, 212, 0.94), rgba(29, 78, 216, 0.8));
      box-shadow: 0 0 42px rgba(34, 211, 238, 0.95), 0 0 18px rgba(254, 240, 138, 0.65);
    }
    #ui-prompt {
      background: rgba(10, 22, 38, 0.54);
      border: 1px solid rgba(255, 255, 255, 0.14);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.12), 0 8px 24px rgba(0, 0, 0, 0.25);
      padding: 8px 18px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.25px;
      transition: opacity 0.25s ease, transform 0.25s var(--spring), background 0.25s;
    }
    #ui-prompt.idle-soft {
      opacity: 0.72;
      font-weight: 600;
    }
    #ui-prompt.urgent {
      opacity: 1;
      background: linear-gradient(135deg, rgba(220, 38, 38, 0.92), rgba(234, 88, 12, 0.92));
      border-color: rgba(253, 224, 71, 0.85);
      font-size: 16.5px;
      transform: scale(1.04);
    }
    #ui-subhint {
      font-size: 12px;
      color: rgba(241, 245, 249, 0.85);
      text-shadow: 0 1px 6px rgba(0, 0, 0, 0.85);
    }
    #ui-subhint:empty { display: none; }

    /* Clean Bottom Controls Dock */
    .hud-bottom-dock {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 12px;
      width: 100%;
    }

    /* Translucent Virtual Analog Joystick */
    #joystick-zone {
      position: relative;
      width: 112px;
      height: 112px;
      flex: 0 0 auto;
      pointer-events: auto;
      touch-action: none;
      opacity: 0.72;
      transition: opacity 0.2s ease, transform 0.2s var(--spring);
    }
    #joystick-zone.is-moving, #joystick-zone:hover { opacity: 1; }
    #joystick-base {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: rgba(10, 22, 38, 0.42);
      border: 1.5px solid rgba(255, 255, 255, 0.18);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow: inset 0 0 20px rgba(255, 255, 255, 0.06), 0 8px 24px rgba(0, 0, 0, 0.28);
    }
    #joystick-base::before, #joystick-base::after {
      content: "";
      position: absolute;
      background: rgba(255, 255, 255, 0.11);
      pointer-events: none;
    }
    #joystick-base::before {
      top: 50%;
      left: 16%;
      right: 16%;
      height: 1px;
    }
    #joystick-base::after {
      left: 50%;
      top: 16%;
      bottom: 16%;
      width: 1px;
    }
    #joystick-knob {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 46px;
      height: 46px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, rgba(186, 230, 253, 0.92), rgba(14, 165, 233, 0.85));
      border: 1.5px solid rgba(255, 255, 255, 0.72);
      box-shadow: 0 6px 18px rgba(14, 165, 233, 0.42);
      pointer-events: none;
      transition: box-shadow 0.18s;
    }
    #joystick-zone.is-moving #joystick-knob {
      box-shadow: 0 0 22px rgba(56, 189, 248, 0.72);
    }

    /* Center Contextual Meters Stack (Hidden cleanly when IDLE!) */
    #center-bottom-stack {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      flex: 1 1 auto;
      max-width: 340px;
      pointer-events: none;
    }

    #dist-pill {
      display: none;
      align-items: center;
      gap: 6px;
      padding: 5px 13px;
      border-radius: 999px;
      font-size: 12.5px;
      color: #cbd5e1;
      transition: opacity 0.2s, transform 0.2s var(--spring);
    }
    #dist-pill.is-visible { display: inline-flex; }
    #dist-pill b { color: #f8fafc; font-weight: 800; }

    #cast-meter-box {
      display: none;
      width: min(300px, 100%);
      border-radius: 16px;
      padding: 10px 14px;
    }

    #combat-hud {
      width: min(330px, 100%);
      border-radius: 18px;
      padding: 12px 15px;
      display: flex;
      flex-direction: column;
      gap: 9px;
      opacity: 0;
      transform: translateY(14px) scale(0.96);
      visibility: hidden;
      transition: opacity 0.26s ease, transform 0.28s var(--spring), visibility 0.26s, border-color 0.2s, box-shadow 0.2s;
    }
    #combat-hud.is-visible {
      opacity: 1;
      transform: translateY(0) scale(1);
      visibility: visible;
      border-color: rgba(56, 189, 248, 0.45);
    }
    #combat-hud.danger-pulse {
      border-color: rgba(239, 68, 68, 0.85);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.15), 0 0 26px rgba(239, 68, 68, 0.36);
    }

    .gauge-block .g-head {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 5px;
    }
    .g-track {
      height: 8px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.14);
      overflow: hidden;
      position: relative;
    }
    .g-fill {
      height: 100%;
      width: 0%;
      border-radius: 999px;
      transition: width 0.05s linear;
    }
    .sweet-zone {
      position: absolute;
      left: 75%;
      width: 17%;
      top: 0;
      bottom: 0;
      background: rgba(251, 191, 36, 0.3);
      border-left: 1px dashed #fbbf24;
      border-right: 1px dashed #fbbf24;
    }

    /* Fullscreen Damage & Electric Shock FX Overlay */
    #fx-overlay {
      position: fixed;
      inset: 0;
      z-index: 18;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.14s ease-out;
    }
    #fx-overlay.flash-bite {
      opacity: 1;
      background: radial-gradient(circle at center, rgba(239, 68, 68, 0.06) 42%, rgba(220, 38, 38, 0.72) 100%);
    }
    #fx-overlay.flash-shock {
      opacity: 1;
      background: radial-gradient(circle at center, rgba(125, 211, 252, 0.25) 25%, rgba(6, 182, 212, 0.62) 100%);
    }

    /* Horror Shark Ambush Closing Jaws Overlay */
    #shark-jaws-overlay {
      position: fixed;
      inset: 0;
      z-index: 19;
      pointer-events: none;
      opacity: 0;
      visibility: hidden;
      --jaw-progress: 0;
      background: radial-gradient(circle at center, transparent 18%, rgba(127, 29, 29, 0.72) 72%, rgba(20, 0, 0, 0.94) 100%);
      transition: opacity 0.1s ease-out;
    }
    #shark-jaws-overlay.active {
      opacity: 1;
      visibility: visible;
    }
    #shark-jaws-overlay .jaw-teeth {
      position: absolute;
      left: -4vw;
      width: 108vw;
      height: 26vh;
      filter: drop-shadow(0 0 14px rgba(239, 68, 68, 0.85)) drop-shadow(0 6px 14px rgba(0, 0, 0, 0.95));
      transition: transform 0.04s linear;
    }
    #shark-jaws-overlay .jaw-top {
      top: -2vh;
      transform: translateY(calc(-20vh + var(--jaw-progress) * 24vh));
    }
    #shark-jaws-overlay .jaw-bottom {
      bottom: -2vh;
      transform: translateY(calc(20vh - var(--jaw-progress) * 24vh));
    }
    #shark-jaws-overlay.chomp-shut .jaw-top {
      transform: translateY(15vh);
      transition: transform 0.07s cubic-bezier(0.2, 1.3, 0.4, 1);
    }
    #shark-jaws-overlay.chomp-shut .jaw-bottom {
      transform: translateY(-15vh);
      transition: transform 0.07s cubic-bezier(0.2, 1.3, 0.4, 1);
    }
    #shark-jaws-overlay.chomp-shut {
      background: radial-gradient(circle at center, rgba(185, 28, 28, 0.72) 0%, rgba(45, 0, 0, 0.98) 85%);
    }

    #boss-combat-bars {
      display: none;
      flex-direction: column;
      gap: 7px;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
    }
    #boss-combat-bars.is-visible { display: flex; }

    #btn-electric-shock {
      display: none;
      align-items: center;
      justify-content: center;
      gap: 5px;
      padding: 8px 15px;
      border-radius: 999px;
      border: 1.5px solid rgba(103, 232, 249, 0.88);
      background: linear-gradient(135deg, rgba(6, 182, 212, 0.88), rgba(37, 99, 235, 0.88));
      color: #ffffff;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      touch-action: none;
      box-shadow: 0 0 22px rgba(34, 211, 238, 0.58);
      transition: transform 0.12s var(--spring), filter 0.15s, opacity 0.15s;
    }
    #btn-electric-shock.is-visible { display: inline-flex; }
    #btn-electric-shock.urgent-boss {
      border-color: #fde047;
      box-shadow: 0 0 26px rgba(56, 189, 248, 0.9), 0 0 14px rgba(250, 204, 21, 0.65);
      animation: pulseRing 0.48s infinite alternate;
    }
    #btn-electric-shock:active { transform: scale(0.9); }
    #btn-electric-shock.on-cooldown {
      opacity: 0.52;
      filter: grayscale(0.45);
      animation: none;
    }

    /* Bottom-Right Tactile Reel & Cast Wheel */
    #reel-action-zone {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 7px;
      flex: 0 0 auto;
      pointer-events: auto;
    }
    #btn-cancel-cast {
      display: none;
      align-items: center;
      justify-content: center;
      padding: 5px 12px;
      border-radius: 999px;
      border: 1px solid rgba(248, 113, 113, 0.48);
      background: rgba(127, 29, 29, 0.65);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: #fecaca;
      font-size: 11.5px;
      font-weight: 700;
      cursor: pointer;
      touch-action: none;
      transition: transform 0.16s var(--spring);
    }
    #btn-cancel-cast:active { transform: scale(0.92); }

    #btn-touch-action {
      position: relative;
      width: 118px;
      height: 118px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.18);
      background: radial-gradient(circle at 35% 28%, rgba(52, 211, 153, 0.28), rgba(10, 22, 38, 0.68));
      backdrop-filter: blur(16px) saturate(160%);
      -webkit-backdrop-filter: blur(16px) saturate(160%);
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      cursor: pointer;
      touch-action: none;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.2), 0 10px 30px rgba(0, 0, 0, 0.38);
      transition: transform 0.14s var(--spring), background 0.22s, box-shadow 0.22s;
    }
    #btn-touch-action:active { transform: scale(0.92); }
    #btn-touch-action.state-charging {
      background: radial-gradient(circle, rgba(14, 165, 233, 0.44), rgba(10, 22, 38, 0.78));
    }
    #btn-touch-action.state-bite {
      background: radial-gradient(circle, rgba(239, 68, 68, 0.78), rgba(127, 29, 29, 0.85));
      animation: pulseRing 0.38s infinite alternate;
    }
    #btn-touch-action.state-fighting {
      background: radial-gradient(circle, rgba(14, 165, 233, 0.4), rgba(10, 22, 38, 0.78));
    }
    .touch-ring-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
      pointer-events: none;
    }
    .touch-ring-track {
      fill: none;
      stroke: rgba(255, 255, 255, 0.14);
      stroke-width: 6.5;
    }
    #touch-ring-progress {
      fill: none;
      stroke: #34d399;
      stroke-width: 6.5;
      stroke-linecap: round;
      stroke-dasharray: 364;
      stroke-dashoffset: 364;
      transition: stroke 0.15s;
    }
    #touch-reel-icon { font-size: 24px; line-height: 1; pointer-events: none; }
    #touch-action-label { font-size: 13.5px; font-weight: 800; pointer-events: none; }
    #touch-action-sub { font-size: 10.5px; color: #cbd5e1; pointer-events: none; }

    /* Toast */
    #game-toast {
      position: fixed;
      top: 66px;
      left: 50%;
      transform: translateX(-50%) translateY(-8px);
      background: rgba(10, 22, 38, 0.78);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(251, 191, 36, 0.42);
      color: #fde68a;
      padding: 8px 18px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      opacity: 0;
      pointer-events: none;
      transition: all 0.22s var(--spring);
      z-index: 80;
      max-width: 88vw;
      text-align: center;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.32);
    }
    #game-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* Frosted Glass Modals & Drawers */
    @keyframes modalPop {
      from { opacity: 0; transform: scale(0.94) translateY(8px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    #catch-modal, #drawer-modal {
      position: fixed;
      inset: 0;
      z-index: 60;
      background: rgba(4, 10, 20, 0.68);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal-card {
      width: 490px;
      max-width: 100%;
      background: linear-gradient(180deg, rgba(16, 36, 62, 0.82) 0%, rgba(8, 18, 32, 0.88) 100%);
      backdrop-filter: blur(22px) saturate(165%);
      -webkit-backdrop-filter: blur(22px) saturate(165%);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 24px;
      padding: 20px;
      text-align: center;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.18), 0 24px 64px rgba(0, 0, 0, 0.6);
      animation: modalPop 0.26s var(--spring);
    }
    #trophy-3d-stage {
      width: 100%;
      min-height: 190px;
      margin: 12px 0;
      border-radius: 16px;
      background: radial-gradient(circle at center, rgba(29, 59, 92, 0.72) 0%, rgba(7, 16, 29, 0.88) 80%);
      border: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    #trophy-3d-stage canvas { max-width: 100%; height: auto !important; }
    .catch-metrics {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin: 10px 0;
    }
    .metric-box {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 14px;
      padding: 9px 6px;
    }
    .metric-box .k { font-size: 11px; color: #94a3b8; }
    .metric-box .v { font-size: 16px; font-weight: 800; margin-top: 3px; }
    .primary-btn {
      margin-top: 12px;
      padding: 12px 34px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: linear-gradient(135deg, #10b981, #0284c7);
      color: white;
      font-size: 14.5px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(16, 185, 129, 0.35);
      transition: transform 0.16s var(--spring), filter 0.18s;
    }
    .primary-btn:hover { filter: brightness(1.08); }
    .primary-btn:active { transform: scale(0.95); }

    .drawer-card {
      width: 540px;
      max-width: 100%;
      background: linear-gradient(180deg, rgba(16, 36, 62, 0.84) 0%, rgba(9, 19, 34, 0.9) 100%);
      backdrop-filter: blur(22px) saturate(165%);
      -webkit-backdrop-filter: blur(22px) saturate(165%);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 22px;
      padding: 18px 20px;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.18), 0 24px 64px rgba(0, 0, 0, 0.6);
      animation: modalPop 0.24s var(--spring);
    }
    .drawer-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
    }
    #drawer-body {
      touch-action: pan-y;
      overflow-y: auto;
      max-height: 64vh;
      -webkit-overflow-scrolling: touch;
      padding-right: 2px;
    }
    .drawer-progress {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 9px 12px;
      margin-bottom: 10px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 12.5px;
      color: #cbd5e1;
    }
    .drawer-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 12px;
      border-radius: 15px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      margin-bottom: 9px;
      transition: background 0.18s, border-color 0.18s;
    }
    .drawer-item:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.15);
    }
    .species-thumb {
      width: 56px;
      height: 56px;
      border-radius: 12px;
      object-fit: cover;
      background: rgba(7, 16, 29, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.12);
      flex-shrink: 0;
    }
    .species-thumb.locked {
      filter: brightness(0.24) saturate(0.2);
    }
    .action-chip {
      padding: 7px 14px;
      border-radius: 999px;
      border: 1px solid rgba(56, 189, 248, 0.42);
      background: rgba(14, 165, 233, 0.2);
      color: #f8fafc;
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: transform 0.16s var(--spring), background 0.18s;
    }
    .action-chip:hover { background: rgba(14, 165, 233, 0.34); }
    .action-chip:active { transform: scale(0.94); }

    /* Leaderboard UI */
    .lb-nick-bar {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-bottom: 10px;
      padding: 8px 10px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.09);
    }
    .lb-nick-bar input {
      flex: 1 1 auto;
      min-width: 0;
      background: rgba(6, 15, 28, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 999px;
      padding: 6px 12px;
      color: #f8fafc;
      font-size: 16px;
      font-weight: 600;
      outline: none;
      touch-action: manipulation;
      pointer-events: auto;
      user-select: text;
      -webkit-user-select: text;
    }
    .lb-nick-bar input:focus { border-color: var(--sky); }
    .lb-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-bottom: 9px;
    }
    .lb-tab {
      padding: 8px 10px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(255, 255, 255, 0.04);
      color: #cbd5e1;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.16s, border-color 0.16s, color 0.16s;
    }
    .lb-tab.active {
      background: rgba(14, 165, 233, 0.24);
      border-color: rgba(56, 189, 248, 0.55);
      color: #ffffff;
    }
    .lb-filters {
      display: flex;
      gap: 6px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }
    .lb-filter-chip {
      padding: 5px 11px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(255, 255, 255, 0.04);
      color: #94a3b8;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }
    .lb-filter-chip.active {
      background: rgba(52, 211, 153, 0.2);
      border-color: rgba(52, 211, 153, 0.55);
      color: #34d399;
    }
    .lb-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 13px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.07);
      margin-bottom: 7px;
    }
    .lb-row.is-me {
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.16), rgba(14, 165, 233, 0.14));
      border-color: rgba(52, 211, 153, 0.5);
    }
    .lb-rank {
      width: 28px;
      text-align: center;
      font-size: 15px;
      font-weight: 800;
      flex-shrink: 0;
    }
    .lb-meta { font-size: 11.5px; color: #94a3b8; margin-top: 2px; }

    /* Mobile Portrait & Compact Viewports (<= 720px wide) */
    @media (max-width: 720px) {
      #hud {
        padding: max(10px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
      }
      .hud-top {
        flex-wrap: wrap;
        gap: 7px;
      }
      .spot-pill {
        padding: 7px 11px;
        font-size: 12.5px;
      }
      .status-capsule {
        width: 100%;
        justify-content: space-between;
        padding: 4px 6px 4px 10px;
        gap: 4px;
        overflow-x: auto;
        scrollbar-width: none;
      }
      .status-capsule::-webkit-scrollbar { display: none; }
      .profile-chip { gap: 5px; padding-right: 5px; }
      .coin-val { font-size: 12px; }
      .xp-bar { width: 32px; }
      .capsule-btn { padding: 4px 8px; font-size: 11.5px; }
      .icon-btn { width: 28px; height: 28px; }
      #game-toast { top: 96px; }

      .hud-bottom-dock {
        flex-wrap: wrap;
        gap: 8px;
      }
      #center-bottom-stack {
        order: -1;
        flex: 1 1 100%;
        max-width: 100%;
        margin-bottom: 2px;
      }
      #combat-hud { width: min(350px, 100%); padding: 10px 13px; }
      #joystick-zone { width: 100px; height: 100px; }
      #joystick-knob { width: 42px; height: 42px; }
      #btn-touch-action { width: 108px; height: 108px; }
      #touch-reel-icon { font-size: 21px; }
      #touch-action-label { font-size: 12.5px; }
    }

    /* Mobile Landscape (<= 500px tall) */
    @media (max-height: 500px) {
      #hud { padding: 8px 14px; gap: 6px; }
      .spot-pill { padding: 6px 11px; font-size: 12px; }
      .status-capsule { width: auto; padding: 4px 6px 4px 10px; }
      #center-bottom-stack { order: 0; flex: 1 1 auto; }
      #joystick-zone { width: 90px; height: 90px; }
      #joystick-knob { width: 38px; height: 38px; }
      #btn-touch-action { width: 96px; height: 96px; }
      #touch-reel-icon { font-size: 19px; }
      #touch-action-label { font-size: 12px; }
    }
  </style>
</head>
<body>
  <div id="loading-screen">
    <div class="load-logo">🎣 釣魚大師 3D</div>
    <div class="load-sub" id="loading-text">正在載入翡翠湖實景與模型...</div>
    <div class="load-track"><div id="loading-bar-fill"></div></div>
  </div>

  <div id="game-viewport"></div>
  <div id="fx-overlay"></div>
  <div id="shark-jaws-overlay" aria-hidden="true">
    <svg class="jaw-teeth jaw-top" viewBox="0 0 1200 220" preserveAspectRatio="none">
      <path d="M0,0 L1200,0 L1200,58 L1130,192 L1060,64 L985,212 L910,66 L830,218 L750,62 L675,214 L600,60 L525,214 L450,62 L370,218 L290,66 L215,212 L140,64 L70,192 L0,58 Z" fill="#070204" stroke="#f8fafc" stroke-width="5" />
    </svg>
    <svg class="jaw-teeth jaw-bottom" viewBox="0 0 1200 220" preserveAspectRatio="none">
      <path d="M0,220 L1200,220 L1200,162 L1130,28 L1060,156 L985,8 L910,154 L830,2 L750,158 L675,6 L600,160 L525,6 L450,158 L370,2 L290,154 L215,8 L140,156 L70,28 L0,162 Z" fill="#070204" stroke="#f8fafc" stroke-width="5" />
    </svg>
  </div>
  <div id="game-toast"></div>

  <div id="hud">
    <div class="hud-top">
      <button class="glass-surface spot-pill" id="btn-env-switch" type="button" title="點擊切換湖景">
        <span class="spot-dot"></span>
        <span id="ui-spot-name">翡翠湖 · 森林湖畔</span>
        <svg class="spot-swap-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
          <path d="M3 3v5h5" />
          <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16" />
          <path d="M16 16h5v5" />
        </svg>
      </button>

      <div class="glass-surface status-capsule">
        <div class="profile-chip">
          <span class="coin-val tabular">🪙 <span id="ui-coins">1,250</span></span>
          <div class="lv-block" title="釣手等級">
            <span class="lv-val tabular" id="ui-level">LV.1</span>
            <div class="xp-bar"><div id="ui-xp-fill"></div></div>
          </div>
        </div>
        <button class="capsule-btn" id="btn-bait-shop" type="button" title="切換魚餌">🪱 <span id="ui-bait-name">蚯蚓</span></button>
        <button class="capsule-btn" id="btn-compendium" type="button" title="魚類圖鑑">📖 圖鑑</button>
        <button class="capsule-btn" id="btn-leaderboard" type="button" title="全球排行榜">🏆 排行</button>
        <button class="icon-btn" id="btn-audio" type="button" aria-label="切換環境音效" title="切換環境音效">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
          </svg>
        </button>
      </div>
    </div>

    <div class="hud-center">
      <div id="strike-qte">💦 揚竿！</div>
      <div id="ui-prompt" class="idle-soft">長按右下輪盤拋竿</div>
      <div id="ui-subhint"></div>
    </div>

    <div class="hud-bottom-dock">
      <div id="joystick-zone" aria-label="移動搖桿">
        <div id="joystick-base">
          <div id="joystick-knob"></div>
        </div>
      </div>

      <div id="center-bottom-stack">
        <div class="glass-surface tabular" id="dist-pill">📍 <b id="ui-dist">-- m</b></div>

        <div class="glass-surface gauge-block" id="cast-meter-box">
          <div class="g-head"><span>拋竿力度</span><span class="tabular" id="val-cast">0%</span></div>
          <div class="g-track">
            <div class="sweet-zone" title="黃金遠投區"></div>
            <div class="g-fill" id="bar-cast" style="background:linear-gradient(90deg,#38bdf8,#fbbf24);"></div>
          </div>
        </div>

        <div class="glass-surface" id="combat-hud">
          <div id="boss-combat-bars">
            <div class="gauge-block">
              <div class="g-head"><span>🦈 大白鯊生命</span><span class="tabular" id="val-shark-hp" style="color:#f87171;">100%</span></div>
              <div class="g-track"><div class="g-fill" id="bar-shark-hp" style="width:100%;background:linear-gradient(90deg,#dc2626,#fb7185);"></div></div>
            </div>
            <div class="gauge-block">
              <div class="g-head"><span>❤️ 釣手生命</span><span class="tabular" id="val-player-hp" style="color:#34d399;">100%</span></div>
              <div class="g-track"><div class="g-fill" id="bar-player-hp" style="width:100%;background:linear-gradient(90deg,#059669,#34d399);"></div></div>
            </div>
          </div>
          <div class="gauge-block">
            <div class="g-head"><span>魚線張力</span><span class="tabular" id="val-tension" style="color:#34d399;">0% · 安全</span></div>
            <div class="g-track"><div class="g-fill" id="bar-tension"></div></div>
          </div>
          <div class="gauge-block">
            <div class="g-head"><span>魚兒體力</span><span class="tabular" id="val-stamina" style="color:#38bdf8;">100% · 待命</span></div>
            <div class="g-track"><div class="g-fill" id="bar-stamina" style="width:100%;background:linear-gradient(90deg,#0284c7,#38bdf8);"></div></div>
          </div>
        </div>
      </div>

      <div id="reel-action-zone">
        <button id="btn-electric-shock" type="button">⚡ 電擊反擊</button>
        <button id="btn-cancel-cast" type="button">收竿重拋</button>
        <button id="btn-touch-action" class="state-idle" type="button" aria-label="拋竿與收線">
          <svg class="touch-ring-svg" viewBox="0 0 128 128">
            <circle class="touch-ring-track" cx="64" cy="64" r="58"></circle>
            <circle id="touch-ring-progress" cx="64" cy="64" r="58"></circle>
          </svg>
          <span id="touch-reel-icon">🎣</span>
          <span id="touch-action-label">按住拋竿</span>
          <span id="touch-action-sub">長按蓄力</span>
        </button>
      </div>
    </div>
  </div>

  <!-- 3D Catch Showcase Modal -->
  <div id="catch-modal">
    <div class="modal-card">
      <div style="font-size:12.5px;font-weight:800;color:#34d399;letter-spacing:1px;">🎉 釣魚成功</div>
      <h2 id="catch-species" style="font-size:24px;margin-top:4px;">鱸魚</h2>
      <div id="catch-badge" style="font-size:13px;font-weight:700;margin-top:3px;">容易 · 標準體型</div>
      <div id="trophy-3d-stage"></div>
      <div class="catch-metrics">
        <div class="metric-box">
          <div class="k">魚體重量</div>
          <div class="v tabular" id="catch-weight" style="color:#f8fafc;">1.42 kg</div>
        </div>
        <div class="metric-box">
          <div class="k">獲得獎勵</div>
          <div class="v tabular" id="catch-gold" style="color:#fbbf24;">+120 金幣</div>
        </div>
        <div class="metric-box">
          <div class="k">經驗提升</div>
          <div class="v tabular" id="catch-xp" style="color:#38bdf8;">+35 XP</div>
        </div>
      </div>
      <div id="catch-record" style="font-size:12.5px;color:#cbd5e1;"></div>
      <button class="primary-btn" id="btn-continue" type="button">繼續垂釣</button>
    </div>
  </div>

  <!-- Fish Compendium / Bait Drawer -->
  <div id="drawer-modal">
    <div class="drawer-card">
      <div class="drawer-head">
        <h3 id="drawer-title" style="font-size:18px;font-weight:800;">魚類圖鑑</h3>
        <button class="icon-btn" id="btn-drawer-close" type="button" aria-label="關閉">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
      <div id="drawer-body"></div>
    </div>
  </div>

  <script type="module" src="./src/game.js"></script>
</body>
</html>
